# Deploy a GitHub Pages (Etapa 8, esquema rama gh-pages).
#
# El source de Pages es la rama gh-pages ("deploy from branch"), no el metodo
# actions/deploy-pages. En esa rama conviven:
#   /                 -> la app (contenido de dist/), servida en la raiz del dominio
#   /e2e/<rama>/       -> reportes Playwright por rama (los publican e2e.yml y
#                         e2e-live.yml; este workflow NO los toca -- clean-exclude)
#   /version.json      -> { "sha": "<commit>" }, marcador que e2e-live.yml consulta
#                         para saber que la version desplegada ya esta propagada
#   /CNAME /.nojekyll  -> dominio personalizado y desactivar Jekyll
#
# Rollback a metodo anterior:
#   gh api -X PUT repos/keber/unicornt-store-frontend/pages -f build_type=workflow
#   y re-ejecutar la version previa de este archivo.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Empujar a gh-pages requiere escritura de contenidos. Ya no aplican
# pages: write / id-token: write (eran del metodo actions/deploy-pages).
permissions:
  contents: write

# Serializa TODA escritura a gh-pages: este workflow, e2e.yml (publish-report)
# y e2e-live.yml empujan a la misma rama; un push concurrente falla por
# non-fast-forward. cancel-in-progress: false -> nunca se aborta un deploy.
concurrency:
  group: "gh-pages-publish"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (lockfile exacto)
        run: npm ci

      # El deploy no depende de que el workflow de CI haya corrido o pasado
      # por separado: valida aca mismo, en el mismo run, para que nunca se
      # publique codigo sin pasar el gate completo.
      - name: Formato (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Pruebas (Vitest)
        run: npm test

      - name: Build (tsc + Vite)
        run: npm run build

      # Archivos de sitio que Vite no genera. Se escriben DESPUES del build
      # porque `vite build` vacia dist/.
      - name: Archivos de Pages (CNAME, .nojekyll, version.json, indice e2e)
        run: |
          echo "unicornt-store.keber.cl" > dist/CNAME
          touch dist/.nojekyll
          printf '{"sha":"%s"}\n' "${{ github.sha }}" > dist/version.json
          mkdir -p dist/e2e
          cp .github/pages/e2e-index.html dist/e2e/index.html

      - name: Publicar dist/ a gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: dist
          branch: gh-pages
          # Historial plano: cada deploy fuerza un unico commit (orphan).
          single-commit: true
          clean: true
          # Preserva los reportes por rama que publican los otros workflows.
          # El indice (e2e/index.html) SI se actualiza desde dist/e2e/.
          clean-exclude: |
            e2e/
            e2e/**
          git-config-name: github-actions[bot]
          git-config-email: 41898282+github-actions[bot]@users.noreply.github.com
