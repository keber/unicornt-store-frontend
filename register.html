<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear cuenta · Unicorn't Store</title>
    <script type="module" crossorigin src="/assets/auth.service-DFlsMdNV.js"></script>
    <script type="module" crossorigin src="/assets/auth.main-B7SGsNg2.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/auth-CqLr8KVv.css">
  </head>
  <body>
    <main class="container" style="max-width: 420px; margin-top: 4rem">
      <h1 class="h4 mb-4">Crear cuenta</h1>
      <form id="register-form" novalidate>
        <div class="mb-3">
          <label class="form-label" for="register-firstName">Nombre</label>
          <input class="form-control" id="register-firstName" name="firstName" autocomplete="given-name" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="register-lastName">Apellido</label>
          <input class="form-control" id="register-lastName" name="lastName" autocomplete="family-name" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="register-email">Email</label>
          <input class="form-control" id="register-email" name="email" type="email" autocomplete="email" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="register-password">Contraseña</label>
          <input
            class="form-control"
            id="register-password"
            name="password"
            type="password"
            autocomplete="new-password"
          />
        </div>
        <p id="register-error" class="text-danger" role="alert" hidden></p>
        <button class="btn btn-primary w-100" id="register-submit" type="submit">Create account</button>
      </form>
      <p class="mt-3 mb-0">¿Ya tienes cuenta? <a href="/login.html">Iniciar sesión</a></p>
    </main>
  </body>
</html>
